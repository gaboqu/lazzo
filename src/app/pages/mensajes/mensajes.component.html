<div class="chat-container">

  <div class="chat-header">
    <div class="chat-header-photo">
      <img [src]="contactoFoto" [alt]="contactoNombre" />
    </div>
    <h3 class="chat-header-name">{{ contactoNombre }}</h3>
  </div>

  <div class="chat-body">
    <div 
      class="chat-bubble" 
      *ngFor="let msg of mensajes"
      [ngClass]="msg.propio ? 'bubble-propio' : 'bubble-otro'"
    >
      {{ msg.texto }}
    </div>
  </div>

  <div class="chat-footer">
    <input 
      type="text" 
      class="chat-input" 
      placeholder="Escribí un mensaje..." 
      [(ngModel)]="nuevoMensaje"
      (keyup.enter)="enviarMensaje()"
    />
    <button class="chat-send-btn" (click)="enviarMensaje()">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>

</div>
